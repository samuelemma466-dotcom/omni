[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni"
version = "0.1.0"
description = "A permissioned local AI agent for Omarchy: tools, plugins, approvals, audit."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
omni = "omni.cli:main"

[tool.setuptools]
packages = ["omni", "omni.tools", "omni.providers"]
